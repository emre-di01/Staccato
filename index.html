<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Staccato – Musikschule</title>
    <meta name="description" content="Staccato – Digitale Verwaltung für Musikschulen. Kurse, Stundenplan, Repertoire und Kommunikation an einem Ort." />

    <!-- PWA -->
    <meta name="theme-color" content="#faf8f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Staccato" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      #root { min-height: 100dvh; min-height: -webkit-fill-available; }
      a { text-decoration: none; }
      button { font-family: inherit; }
      input, textarea, select { font-family: inherit; }
      /* Prevent iOS Safari from auto-zooming on input focus */
      @media (max-width: 768px) {
        input, textarea, select { font-size: 16px !important; }
      }
    </style>
    <!-- Capacitor native: show JS errors visually + disable service worker -->
    <script>
      (function () {
        var isNative = typeof window.Capacitor !== 'undefined' || window.location.hostname === 'localhost';
        if (isNative) {
          // Show unhandled JS errors on screen so they're visible without DevTools
          function showErr(label, msg) {
            var d = document.createElement('div');
            d.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:12px 16px;background:#b00020;color:#fff;font:12px/1.4 monospace;z-index:99999;word-break:break-all;white-space:pre-wrap;';
            d.textContent = label + msg;
            (document.body || document.documentElement).appendChild(d);
          }
          window.onerror = function(msg, src, line) {
            showErr('JS Error: ', msg + '\n' + (src || '').split('/').pop() + ':' + line);
          };
          window.addEventListener('unhandledrejection', function(e) {
            showErr('Promise Error: ', e.reason && e.reason.message ? e.reason.message : String(e.reason));
          });
          // Disable PWA service worker – it can block navigation in Android WebView
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register = function() { return Promise.resolve(null); };
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            }).catch(function() {});
          }
        }
      })();
    </script>
    <!-- Apply background color and theme-color before React renders to avoid flash -->
    <script>
      (function () {
        try {
          var BG = {
            klassik: { light: '#faf8f4', dark: '#0f0d0a' },
            modern:  { light: '#f0f7f7', dark: '#050f0f' },
            bold:    { light: '#faf5f5', dark: '#0f0505' },
            kreativ: { light: '#faf5ff', dark: '#0a0514' },
            liquid:  { light: '#C8D8F8', dark: '#0A1628' },
            fresh:   { light: '#f0fdf4', dark: '#020f06' },
          };
          var theme = localStorage.getItem('staccato_theme') || 'klassik';
          var dark  = localStorage.getItem('staccato_dark') === 'true';
          var bg    = (BG[theme] || BG.klassik)[dark ? 'dark' : 'light'];
          document.documentElement.style.backgroundColor = bg;
          document.body.style.backgroundColor = bg;
          var metaTC = document.querySelector('meta[name="theme-color"]');
          if (metaTC) metaTC.setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
