# ── Frontend: 401dev.de ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 401dev.de www.401dev.de;

    ssl_certificate /etc/letsencrypt/live/401dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/401dev.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/edidev/dev/staccato/staccato/dist;
    index index.html;

    # Service Worker und index.html nie cachen — Browser muss immer die aktuelle Version prüfen
    location ~* (sw\.js|registerSW\.js)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        access_log off;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Assets mit Content-Hash im Dateinamen: 1 Jahr cachen
    location ~* \.(js|css|woff2|png|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri /index.html;
    }
}

# ── Supabase API: api.401dev.de ──────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.401dev.de;

    ssl_certificate /etc/letsencrypt/live/401dev.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/401dev.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Interne Supabase-Endpunkte sperren (MCP, pg-meta, analytics)
    location ~ ^/(mcp|pg|pg-meta|analytics) {
        return 403;
    }

    # iCal-Kalender (anon, kein Auth-Header nötig)
    location /functions/v1/kalender {
        proxy_pass http://localhost:54321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0";
    }

    # Erlaubte API-Pfade
    location ~ ^/(rest/v1|auth/v1|storage/v1|realtime/v1|functions/v1) {
        proxy_pass http://localhost:54321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    # Alles andere sperren
    location / {
        return 403;
    }
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 401dev.de www.401dev.de api.401dev.de;
    return 301 https://$host$request_uri;
}
