name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    name: Supabase Functions Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          supabase functions deploy accept-invitation
          supabase functions deploy demo-anfragen
          supabase functions deploy demo-genehmigen
          supabase functions deploy invoice-extract
          supabase functions deploy kalender
          supabase functions deploy lyrics-suche
          supabase functions deploy send-email
          supabase functions deploy send-push
          supabase functions deploy spotify-suche
          supabase functions deploy stunden-erinnerung
          supabase functions deploy ytmusic-suche
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
